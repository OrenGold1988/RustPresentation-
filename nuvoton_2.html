<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0"/>
    <title>Nuvoton Hardware Zoom</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --bg: #0f172a;
            --accent: #38bdf8; 
            --nuvoton-red: #ff3333; 
            --text: #ffffff;
            --muted: #f1f5f9; 
            --card-bg: #1e293b;
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .slide-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px 50px;
        }

        /* Matches the Header from Slide 1 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .slide-title {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.1;
        }
        
        .title-highlight { color: var(--accent); }

        /* Main content area for the image */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 100px; /* Space for nav */
        }
        
        .img-container {
            position: relative;
            max-width: 90%; 
            max-height: 85%; 
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        #main-img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 20px;
            border: 2px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .magnifier {
            position: absolute;
            border: 4px solid var(--accent);
            border-radius: 50%;
            width: 280px; 
            height: 280px;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.2);
            z-index: 50;
        }

        /* Navigation Buttons - Exactly like Slide 1 */
        .bottom-nav {
            position: fixed; bottom: 30px; left: 50px; right: 50px;
            display: flex; justify-content: space-between;
            z-index: 100;
        }

        .nav-btn {
            display: inline-flex; align-items: center; gap: 12px;
            padding: 16px 36px; border-radius: 999px; color: #0f172a; text-decoration: none;
            font-weight: 800; font-size: 22px; background-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .nav-prev { 
            background-color: #cbd5e1; 
        }

        .nav-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
    </style>
</head>

<body>
<div class="slide-container">
    <div class="header-area">
        <h1 class="slide-title">
            Hardware Spotlight: <br>
            <span class="title-highlight">Legacy Implementation on Motherboard</span>
        </h1>
        <div class="text-white font-black text-3xl">NUVOTON</div>
    </div>

    <div class="main-content">
        <div class="img-container" id="zoom-area">
            <img id="main-img" src="Data/nuvont_on_old_mother_board.jpg" alt="Hardware View">
            <div id="glass" class="magnifier"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <a class="nav-btn nav-prev" href="nuvoton_1.html">
            <i class="fas fa-arrow-left"></i> Previous
        </a>
        <a class="nav-btn" href="index_ot.html">
            Next Slide <i class="fas fa-arrow-right"></i>
        </a>
    </div>
</div>

<script>
    const img = document.getElementById("main-img");
    const glass = document.getElementById("glass");
    const container = document.getElementById("zoom-area");
    const zoom = 2.5; 

    container.addEventListener("mousemove", moveMagnifier);
    container.addEventListener("mouseenter", () => glass.style.display = "block");
    container.addEventListener("mouseleave", () => glass.style.display = "none");

    function moveMagnifier(e) {
        const rect = img.getBoundingClientRect();
        
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        if (x > rect.width || x < 0 || y > rect.height || y < 0) {
            glass.style.display = "none";
            return;
        }

        glass.style.display = "block";
        glass.style.backgroundImage = `url('${img.src}')`;
        glass.style.backgroundSize = (rect.width * zoom) + "px " + (rect.height * zoom) + "px";
        
        let w = glass.offsetWidth / 2;
        let h = glass.offsetHeight; 
        
        // Position glass above the cursor for visibility
        glass.style.left = (x - w) + "px";
        glass.style.top = (y - h - 30) + "px"; 

        // Offset the background so it shows what's under the cursor
        glass.style.backgroundPosition = "-" + ((x * zoom) - w) + "px -" + ((y * zoom) - (glass.offsetHeight / 2)) + "px";
    }
</script>
</body>
</html>
