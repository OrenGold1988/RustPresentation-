<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0"/>
    <title>Thank You - OpenTitan Style</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --bg-1: #0f172a;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            --accent: #38bdf8; 
            --text: #ffffff;
            --card-bg: rgba(30, 41, 59, 0.7); 
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: var(--bg-1);
            background: var(--bg-gradient);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .slide-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 60px; 
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        /* Standardized Large Title from first slide */
        .main-title {
            font-size: 82px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .title-highlight { 
            color: var(--accent);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Subtitle Styling */
        .subtitle-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out both;
            animation-delay: 0.4s;
        }

        .divider-line {
            width: 60px;
            height: 4px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        .questions-text {
            font-size: 34px;
            font-weight: 700;
            color: #cbd5e1;
        }

        .subtext {
            font-size: 20px;
            color: #94a3b8;
            animation: fadeInUp 0.8s ease-out both;
            animation-delay: 0.6s;
        }

        /* Decorative Background Elements (Kept from original but softened) */
        .decorative-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
        }
        .circle-1 { width: 500px; height: 500px; background-color: var(--accent); top: -100px; right: -100px; }
        .circle-2 { width: 400px; height: 400px; background-color: #6366f1; bottom: -100px; left: -100px; }

        /* Icon styling */
        .icon-container {
            font-size: 80px;
            color: var(--accent);
            margin-bottom: 30px;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* Standard Navigation matching Slide 1 */
        .bottom-nav {
            position: fixed; 
            bottom: 30px; 
            left: 50px; 
            right: 50px;
            display: flex; 
            justify-content: space-between;
        }

        .nav-btn {
            display: inline-flex; 
            align-items: center; 
            gap: 12px;
            padding: 16px 36px; 
            border-radius: 999px; 
            color: #0f172a; 
            text-decoration: none;
            font-weight: 800; 
            font-size: 22px; 
            background-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        
        .nav-prev { 
            background-color: #cbd5e1; 
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

<div class="slide-container">
    <div class="decorative-element circle-1"></div>
    <div class="decorative-element circle-2"></div>

    <div class="icon-container">
        <i class="fas fa-check-circle"></i>
    </div>

    <h1 class="main-title">
        <span class="title-highlight">Thank</span> You
    </h1>

    <div class="subtitle-container">
        <div class="divider-line"></div>
        <h2 class="questions-text">Questions?</h2>
        <div class="divider-line"></div>
    </div>

    <p class="subtext">Contact and references available upon request</p>

    <nav class="bottom-nav">
        <a class="nav-btn nav-prev" href="ot_5.html">
            <i class="fas fa-arrow-left"></i>
            <span>Previous Slide</span>
        </a>
        <div></div> 
    </nav>
</div>

</body>
</html>
